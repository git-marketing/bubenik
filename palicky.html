<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Paličky</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow+Condensed:wght@500;600&family=Oleo+Script:wght@700&display=swap">
<style>
/* Layout: one screen seen from the drummer's stool. Tempo above, the kit in the middle, band commands under the thumbs. */
:root{
  color-scheme:dark;
  --floor:#0e2a31; --floor-2:#14373f; --panel:#1b4650; --line:#2f606b;
  --ink:#f3ecd9; --dim:#a8c0bd;
  --bronze:#dca954; --bronze-ink:#241505;
  --shell:#b5252f; --shell-hi:#d9414a;
  --display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --text:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --script:"Oleo Script",Georgia,serif;
  background:var(--floor);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--floor);color:var(--ink);font:500 16px/1.25 var(--text);overflow:hidden;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.app{height:100%;max-width:620px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}

/* top: groove and tempo */
.top{display:grid;gap:8px;min-width:0}
.row1{display:flex;gap:10px;align-items:stretch;min-width:0}
.groove{flex:1;min-width:0;text-align:left;background:var(--floor-2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:grid;align-content:center}
.groove small{font-size:13px;color:var(--dim);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.groove strong{font:800 24px/1.05 var(--display);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tempo{display:flex;align-items:stretch;gap:4px}
.tempo button{background:var(--floor-2);border:1px solid var(--line);border-radius:10px;min-width:40px;font:800 22px var(--display)}
.tempo .tap{min-width:48px;font:600 15px var(--text);letter-spacing:.1em;color:var(--bronze)}
.tempo button:active{background:var(--panel)}
.bpm{display:grid;justify-items:center;align-content:center;min-width:64px}
.bpm b{font:800 38px/.95 var(--display);font-variant-numeric:tabular-nums}
.bpm span{font-size:11px;letter-spacing:.14em;color:var(--dim)}
.row2{display:flex;align-items:center;gap:10px;min-height:32px;min-width:0}
.beats{display:flex;gap:5px;flex:none}
.beats i{width:13px;height:13px;border-radius:50%;background:var(--panel);display:block}
.beats i.on{background:var(--bronze)}
.beats i.first.on{background:var(--shell-hi)}
#status{flex:1;min-width:0;color:var(--dim);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status em{font-style:normal;color:var(--bronze)}
.tabs{display:flex;gap:6px;flex:none}
.tabs button{padding:5px 11px;border-radius:8px;border:1px solid var(--line);font-size:15px;letter-spacing:.03em}
.tabs button:active{background:var(--panel)}

/* stage: the kit from above */
.stage{position:relative;min-height:0;touch-action:none}
.stage::before{content:"";position:absolute;inset:2% -2% 0;border-radius:46%/42%;
  background:radial-gradient(closest-side,var(--floor-2),transparent);}
.pad{position:absolute;border-radius:50%;transform:translate(-50%,-50%);touch-action:none;display:block}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:50%;pointer-events:none}
.pad .flash{position:absolute;inset:0;border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(circle,rgba(255,244,214,.75) 0 35%,rgba(255,200,110,.35) 70%,transparent 74%)}
.pad .lab{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none;color:#33261a;display:grid;line-height:1}
.pad .lab b{font:800 max(14px,calc(var(--d)*.125)) var(--display);letter-spacing:.03em;text-transform:uppercase}
.pad .lab i{font:600 12px var(--text);font-style:normal;margin-top:2px;opacity:.85}
.pad.cym .lab{top:72%;color:var(--bronze-ink)}
.pad.kick .lab{top:80%}

/* commands */
.cmds{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr;grid-template-rows:54px 54px;gap:6px}
.cmd{border-radius:10px;background:var(--floor-2);border:1px solid var(--line);font:800 20px/1 var(--display);letter-spacing:.02em;position:relative}
.cmd:active{background:var(--panel)}
.cmd.on{background:var(--bronze);border-color:var(--bronze);color:var(--bronze-ink)}
.cmd.next{border-color:var(--bronze);color:var(--bronze);animation:pulse .5s steps(2) infinite alternate}
@keyframes pulse{to{background:var(--panel)}}
#play{grid-row:1/3;background:var(--shell);border-color:var(--shell-hi);font-size:30px;color:#fff6e6}
#play:active{background:var(--shell-hi)}
#play.live{background:var(--floor-2);border-color:var(--shell-hi);color:var(--shell-hi)}
#fill{grid-column:2/4}

/* sheets */
.veil{position:fixed;inset:0;background:rgba(5,18,22,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:620px;max-height:86%;background:var(--floor-2);border-top:2px solid var(--bronze);border-radius:16px 16px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sheet h2{margin:0;font:800 26px var(--display)}
.close{padding:7px 14px;border:1px solid var(--line);border-radius:8px}
.body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;min-height:0}
.list{display:grid;gap:4px}
.gr{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;text-align:left;padding:10px 12px;border-radius:9px;background:var(--floor);border:1px solid transparent}
.gr b{font:800 21px var(--display)}
.gr span{color:var(--dim);font-variant-numeric:tabular-nums}
.gr.on{border-color:var(--bronze)}
.gr.on b{color:var(--bronze)}
h3{margin:0 0 6px;font:600 13px var(--text);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;padding:9px 6px;border-radius:8px;background:var(--floor);border:1px solid var(--line);white-space:nowrap}
.seg button.on{background:var(--bronze);border-color:var(--bronze);color:var(--bronze-ink);font-weight:600}
.sl{display:grid;grid-template-columns:92px minmax(0,1fr) 38px;align-items:center;gap:8px;min-height:36px}
.sl output{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--bronze);margin:0;height:28px}
.hint{color:var(--dim);margin:0;font-size:15px;line-height:1.3;max-width:62ch}
.gridwrap{overflow-x:auto}
table.grid{border-collapse:separate;border-spacing:0;width:100%}
.grid th{font:600 12px var(--text);color:var(--dim);text-align:left;padding-right:6px;white-space:nowrap;position:sticky;left:0;background:var(--floor-2);z-index:1}
.grid td{padding:1px;min-width:15px}
.grid td.bt{padding-left:5px}
.cell{display:block;width:100%;height:24px;border-radius:4px;background:var(--floor);position:relative}
.cell.playh{box-shadow:inset 0 0 0 1px var(--ink)}
.cell::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:var(--bronze);width:0;height:0}
.cell[data-v=x]::after,.cell[data-v=o]::after{width:10px;height:10px}
.cell[data-v=o]::after{opacity:.7}
.cell[data-v=X]::after{width:15px;height:15px;background:var(--shell-hi)}
.cell[data-v=g]::after{width:6px;height:6px;opacity:.75}
.reset{padding:8px 12px;border:1px solid var(--line);border-radius:8px;justify-self:start}

@media (orientation:landscape) and (max-height:520px){
  .app{max-width:none;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:16px}
  .stage{grid-column:1;grid-row:1/3}
  .top{grid-column:2;grid-row:1}
  .cmds{grid-column:2;grid-row:2;align-self:end;grid-template-rows:minmax(40px,1fr) minmax(40px,1fr)}
}
@media (max-width:360px){
  .tempo button{min-width:32px}.tempo .tap{min-width:40px}.bpm{min-width:52px}.bpm b{font-size:32px}
  .cmd{font-size:18px}#play{font-size:25px}
}
@media (prefers-reduced-motion:reduce){.cmd.next{animation:none;background:var(--panel)}}
</style>
</head>
<body>
<div class="app">
  <section class="top">
    <div class="row1">
      <button class="groove" id="openGroove" aria-label="Vybrať rytmus">
        <small id="gMeta">4/4</small><strong id="gName">Rock</strong>
      </button>
      <div class="tempo">
        <button id="minus" aria-label="Pomalšie">−</button>
        <div class="bpm"><b id="bpm">112</b><span>BPM</span></div>
        <button id="plus" aria-label="Rýchlejšie">+</button>
        <button class="tap" id="tap" aria-label="Vyťukať tempo">TAP</button>
      </div>
    </div>
    <div class="row2">
      <div class="beats" id="beats" aria-hidden="true"></div>
      <div id="status" aria-live="polite">Ladím súpravu…</div>
      <div class="tabs">
        <button id="openNotes">Noty</button>
        <button id="openMix">Zvuk</button>
      </div>
    </div>
  </section>

  <section class="stage" id="stage" aria-label="Bicia súprava"></section>

  <section class="cmds" aria-label="Povely pre bubeníka">
    <button class="cmd" id="play">Štart</button>
    <button class="cmd" data-sec="v">Sloha</button>
    <button class="cmd" data-sec="c">Refrén</button>
    <button class="cmd" data-sec="b">Mostík</button>
    <button class="cmd" id="fill">Prechod</button>
    <button class="cmd" id="end">Koniec</button>
  </section>
</div>

<div class="veil" id="veil" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header><h2 id="sheetTitle"></h2><button class="close" id="closeSheet">Zavrieť</button></header>
    <div class="body" id="sheetBody"></div>
  </div>
</div>

<script>
/* ───────── Rytmy ─────────
   Znaky: X silno, x normálne, o jemne, g ghost note, . nič
   Stopy: k kopák, s virbel, r rim, h hi-hat, o otvorený hat, p pedál, R ride, B zvon, c crash, T M F tomy */
const G=[
 {id:'rock',n:'Rock',m:'4/4',bpm:112,beats:4,pb:4,sw:0,fill:'toms',
  v:{k:'x.....x.x.......',s:'....X.......X...',h:'X.x.x.x.X.x.x.x.'},
  c:{k:'x.....x.x.x.....',s:'....X.......X...',o:'x.x.x.x.x.x.x.x.'},
  b:{k:'x.......x.......',r:'....x.......x...',h:'o.o.o.o.o.o.o.o.'}},
 {id:'pop',n:'Pop',m:'4/4',bpm:100,beats:4,pb:4,sw:0,fill:'toms',
  v:{k:'x.....x...x..x..',s:'....X.......X...',h:'xoxoxoxoxoxoxoxo'},
  c:{k:'x..x..x...x..x..',s:'....X.......X...',o:'x...x...x...x...',h:'..o...o...o...o.'},
  b:{k:'x.........x.....',r:'....x.......x...',p:'x.x.x.x.x.x.x.x.'}},
 {id:'funk',n:'Funk',m:'4/4',bpm:98,beats:4,pb:4,sw:.12,fill:'toms',
  v:{k:'x..x..x...x.....',s:'....X..g.g..X..g',h:'xoxoxoxoxoxoxoxo'},
  c:{k:'x.x...x..x.x..x.',s:'....X..g.g..X..g',h:'xoxoxoxoxoxoxo..',o:'..............x.'},
  b:{k:'x.........x.....',s:'....x..g.g..x...',p:'x.x.x.x.x.x.x.x.'}},
 {id:'disco',n:'Disco',m:'4/4',bpm:120,beats:4,pb:4,sw:0,fill:'toms',
  v:{k:'x...x...x...x...',s:'....X.......X...',h:'x...x...x...x...',o:'..x...x...x...x.'},
  c:{k:'X...X...X...X...',s:'....X.......X..g',h:'xo..xo..xo..xo..',o:'..x...x...x...x.'},
  b:{k:'x...x...x...x...',r:'....o.......o...',p:'..x...x...x...x.'}},
 {id:'shuffle',n:'Blues shuffle',m:'4/4 triola',bpm:92,beats:4,pb:3,sw:0,fill:'toms',
  v:{k:'x.....x.....',s:'...X.....X..',h:'x.ox.ox.ox.o'},
  c:{k:'x.ox..x.ox..',s:'...X.....X..',R:'x.ox.ox.ox.o'},
  b:{k:'x.....x.....',r:'...x.....x..',h:'o.oo.oo.oo.o'}},
 {id:'ballad',n:'Balada',m:'12/8',bpm:66,beats:4,pb:3,sw:0,fill:'toms',
  v:{k:'x.....x.o...',s:'...X.....X..',h:'xooxooxooxoo'},
  c:{k:'x..o..x.o...',s:'...X.....X..',R:'xooxooxooxoo'},
  b:{k:'x.....o.....',r:'...o.....o..',h:'o.oo.oo.oo.o'}},
 {id:'polka',n:'Polka',m:'2/4',bpm:120,beats:2,pb:4,sw:0,fill:'snare',strict:1,
  v:{k:'x...x...',s:'..x...x.',h:'..x...x.'},
  c:{k:'X...X...',s:'..X...X.',o:'..x...x.'},
  b:{k:'x...x...',r:'..o...o.',p:'..o...o.'}},
 {id:'waltz',n:'Valčík',m:'3/4',bpm:150,beats:3,pb:4,sw:0,fill:'snare',strict:1,
  v:{k:'x...........',s:'....x...x...',h:'....x...x...'},
  c:{k:'X.......o...',s:'....X...x...',o:'....x...x...'},
  b:{k:'x...........',r:'....o...o...',p:'....o...o...'}},
 {id:'bossa',n:'Bossa nova',m:'4/4',bpm:130,beats:4,pb:4,sw:0,fill:'snare',strict:1,
  v:{k:'x..oo..ox..oo..o',r:'x..x..x...x.x...',h:'o.o.o.o.o.o.o.o.'},
  c:{k:'x..xx..xx..xx..x',r:'x..x..x...x.x...',R:'x.o.x.o.x.o.x.o.'},
  b:{k:'o..oo..oo..oo..o',r:'o..o..o...o.o...',p:'..o...o...o...o.'}},
 {id:'reggae',n:'Reggae',m:'4/4',bpm:76,beats:4,pb:4,sw:.2,fill:'snare',strict:1,
  v:{k:'........X.......',r:'........x.......',h:'x.x.x.x.x.x.x.x.'},
  c:{k:'x.......X.......',s:'........X.......',h:'x.xox.x.x.xox.x.'},
  b:{k:'........x.......',r:'........o.......',p:'x...x...x...x...'}},
 {id:'hiphop',n:'Hip-hop',m:'4/4',bpm:88,beats:4,pb:4,sw:.32,fill:'snare',
  v:{k:'x.....x..x.x....',s:'....X.......X...',h:'x.x.x.x.x.x.x.x.'},
  c:{k:'x..x..x..x.x..x.',s:'....X.......X...',h:'xoxoxoxoxoxoxoxo'},
  b:{k:'x.........x.....',r:'....x.......x...',h:'x...x...x...x...'}},
 {id:'metal',n:'Metal',m:'4/4',bpm:150,beats:4,pb:4,sw:0,fill:'toms',
  v:{k:'x.xxx.xxx.xxx.xx',s:'....X.......X...',R:'X.x.X.x.X.x.X.x.'},
  c:{k:'xxxxxxxxxxxxxxxx',s:'....X.......X...',c:'x...x...x...x...'},
  b:{k:'x..x..x.x..x..x.',s:'........X.......',o:'x...x...x...x...'}},
 {id:'country',n:'Country',m:'4/4',bpm:110,beats:4,pb:4,sw:0,fill:'snare',
  v:{k:'x...x...x...x...',s:'gogoXogogogoXogo',p:'..x...x...x...x.'},
  c:{k:'x...x...x...x...',s:'gogoXogogogoXogo',o:'..x...x...x...x.'},
  b:{k:'x.......x.......',r:'....x.......x...',p:'..x...x...x...x.'}},
 {id:'swing',n:'Jazz swing',m:'4/4 triola',bpm:140,beats:4,pb:3,sw:0,fill:'snare',strict:1,
  v:{k:'g..g..g..g..',s:'.....g......',R:'x..x.ox..x.o',p:'...x.....x..'},
  c:{k:'x.....g..o..',s:'.....o.....x',R:'X..x.oX..x.o',p:'...x.....x..'},
  b:{s:'o.oo.oo.oo.o',p:'...x.....x..'}}
];
G.forEach(g=>g.steps=g.beats*g.pb);
const V={X:1,x:.78,o:.5,g:.24};
const SEC={v:'Sloha',c:'Refrén',b:'Mostík'};

/* ───────── Nastavenia ───────── */
const DEF={groove:'rock',bpm:112,kit:'studio',out:'phone',count:true,
  vol:{kick:85,snare:80,hat:62,tom:75,cym:60},room:45,swing:0,feel:15,life:45,human:45,power:85};
let S=JSON.parse(JSON.stringify(DEF)),EDITS={};
try{const d=JSON.parse(localStorage.getItem('palicky-v1')||'null');
  if(d){Object.assign(S,d.S||{});S.vol=Object.assign({},DEF.vol,(d.S||{}).vol);EDITS=d.E||{};}}catch(e){}
let saveT=0;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('palicky-v1',JSON.stringify({S,E:EDITS}))}catch(e){}},300)}
const cur=()=>G.find(g=>g.id===S.groove)||G[0];
function pat(g,sec){return Object.assign({},g[sec],(EDITS[g.id]||{})[sec]||{})}

/* ───────── Zvuk: súprava sa syntetizuje vopred do bufferov ───────── */
const KITS={
 studio:{n:'Štúdio',kick:53,kickD:.30,sn:196,snD:.19,tom:1,hat:1,room:.16,cym:1},
 rock:{n:'Rock',kick:48,kickD:.38,sn:172,snD:.27,tom:.88,hat:.93,room:.30,cym:.92},
 jazz:{n:'Jazz',kick:74,kickD:.22,sn:238,snD:.14,tom:1.3,hat:1.07,room:.13,cym:1.1},
 elektro:{n:'Elektro',kick:44,kickD:.62,sn:206,snD:.15,tom:.92,hat:1.25,room:.07,cym:1.2}
};
const SR=44100,LV=[.34,.62,1];
const NOISE=(()=>{const b=new AudioBuffer({length:SR*3,numberOfChannels:1,sampleRate:SR}),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b})();
const SATC=(()=>{const c=new Float32Array(1025);for(let i=0;i<1025;i++){const x=i/512-1;c[i]=Math.tanh(x*1.9)/Math.tanh(1.9)}return c})();
function env(o,peak,dec,t=0){const g=o.createGain();g.gain.setValueAtTime(peak,t);g.gain.exponentialRampToValueAtTime(.0006,t+dec);return g}
function noise(o,dur){const s=o.createBufferSource();s.buffer=NOISE;s.loop=true;s.start(0,Math.random()*2.5);s.stop(dur);return s}
function filt(o,type,f,q){const n=o.createBiquadFilter();n.type=type;n.frequency.value=f;if(q)n.Q.value=q;return n}
function osc(o,type,f,dur){const n=o.createOscillator();n.type=type;n.frequency.value=f;n.start(0);n.stop(dur);return n}
function metal(o,base,dest,dur,lvl){[2,3,4.16,5.43,6.79,8.21].forEach(r=>{const a=osc(o,'square',base*r*(1+(Math.random()-.5)*.004),dur),g=o.createGain();g.gain.value=lvl;a.connect(g).connect(dest)})}
function tomVoice(o,f,dec,v){
  const out=o.destination,a=osc(o,'sine',f,dec),b=osc(o,'triangle',f*1.52,dec*.5);
  a.frequency.setValueAtTime(f*1.75,0);a.frequency.exponentialRampToValueAtTime(f,.07);
  b.frequency.setValueAtTime(f*2.3,0);b.frequency.exponentialRampToValueAtTime(f*1.52,.05);
  a.connect(env(o,.8*v,dec)).connect(out);b.connect(env(o,.2*v,dec*.45)).connect(out);
  noise(o,.05).connect(filt(o,'bandpass',1400+f*3,.7)).connect(env(o,.22*v,.035)).connect(out);
}
const LEN={k:.8,s:.55,r:.16,st:.06,h:.11,o:.8,p:.14,R:1.8,B:1.1,c:2.6,C:1.9,T:.75,M:.85,F:1.05};
function synth(o,l,lv,K){
  const out=o.destination,v=Math.pow(lv,1.25),d=LEN[l];
  if(l==='k'){
    const sh=o.createWaveShaper();sh.curve=SATC;sh.connect(out);
    const a=osc(o,'sine',K.kick,d);a.frequency.setValueAtTime(K.kick*3.4,0);a.frequency.exponentialRampToValueAtTime(K.kick,.05);
    a.connect(env(o,.78*v,K.kickD)).connect(sh);

}
function layout(){
  const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
  const u=Math.min(w/100,h/HEIGHT),dpr=Math.min(3,window.devicePixelRatio||1);
  PADS.forEach((p,i)=>{
    const d=p.d*u,el=p.el;
    p.px=p.x/100*w;p.py=p.y/HEIGHT*h;p.pr=d/2;
    el.style.left=p.px+'px';el.style.top=p.py+'px';el.style.width=el.style.height=d+'px';el.style.setProperty('--d',d+'px');
    const size=Math.round(d*dpr);
    p.cv.width=p.cv.height=size;
    const c=p.cv.getContext('2d'),rnd=seeded(7919*(i+3));
    c.setTransform(1,0,0,1,0,0);
    if(p.type==='cym')drawCym(c,size,p,rnd);else drawDrum(c,size,p,rnd);
  });
}
new ResizeObserver(layout).observe(stage);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
function flash(id,v){
  const p=PADS.find(q=>q.id===id);if(!p)return;
  const a=.25+.75*Math.min(1,v);
  p.fl.animate([{opacity:a},{opacity:0}],{duration:p.type==='cym'?320:170,easing:'ease-out'});
  if(reduce)return;
  if(p.type==='cym')p.cv.animate([{transform:'rotate('+(-1.8*a)+'deg) scale(.985)'},{transform:'rotate('+(1*a)+'deg)'},{transform:'none'}],{duration:280,easing:'ease-out'});
  else p.cv.animate([{transform:'scale('+(1-.035*a)+')'},{transform:'none'}],{duration:130,easing:'ease-out'});
}
stage.addEventListener('pointerdown',ev=>{
  ev.preventDefault();ensureAudio();
  const rect=stage.getBoundingClientRect(),x=ev.clientX-rect.left,y=ev.clientY-rect.top;
  let best=null,br=1.08;
  PADS.forEach(p=>{const q=Math.hypot(x-p.px,y-p.py)/p.pr;if(q<br){br=q;best=p}});
  if(!best)return;
  const l=best.hit(br),v=.84+Math.random()*.1;
  play(l,v,ctx.currentTime,true);flash(best.id,v);
});
['touchend','pointerup','click','keydown'].forEach(n=>document.addEventListener(n,()=>{if(ctx&&ctx.state!=='running')ctx.resume()},{passive:true}));

/* ───────── Obsluha ───────── */
const $=id=>document.getElementById(id);
let beatEls=[];
function buildBeats(){const g=cur();$('beats').innerHTML=Array.from({length:g.beats},(_,i)=>'<i class="'+(i?'':'first')+'"></i>').join('');beatEls=[...$('beats').children]}
function markBeat(b){beatEls.forEach((e,i)=>e.classList.toggle('on',i===b))}
let cells=null;
function markStep(i){if(!cells)return;cells.forEach(row=>row.forEach((c,j)=>c.classList.toggle('playh',j===i)))}
function ui(){
  const g=T.queuedGroove?G.find(x=>x.id===S.groove):cur();
  $('gName').textContent=g.n;$('gMeta').textContent='Rytmus · '+g.m;$('bpm').textContent=S.bpm;
  if(beatEls.length!==g.beats)buildBeats();
  $('play').textContent=T.playing?'Stop':'Štart';$('play').classList.toggle('live',T.playing);
  document.querySelectorAll('[data-sec]').forEach(b=>{b.classList.toggle('on',T.section===b.dataset.sec);b.classList.toggle('next',T.queued===b.dataset.sec)});
  $('end').classList.toggle('next',T.ending);
  $('fill').classList.toggle('next',!!T.fillNext);
  let s;
  if(!T.playing)s=BUF.k?'Pripravený. Klepni na bubny alebo daj Štart.':'Ladím súpravu…';
  else if(T.isCount)s='Odpočítavam…';
  else if(T.ending)s='<em>Končím na ďalší takt</em>';
  else if(T.queuedGroove)s='<em>Ďalší takt: '+G.find(x=>x.id===T.queuedGroove).n+'</em>';
  else if(T.queued)s='<em>Ďalší takt: '+SEC[T.queued]+'</em>';
  else s=SEC[T.section]+' · takt '+T.bar;
  $('status').innerHTML=s;
}
function frame(){
  if(ctx){
    const now=ctx.currentTime-(ctx.outputLatency||ctx.baseLatency||0);
    while(vis.length){
      let idx=-1;for(let i=0;i<Math.min(vis.length,12);i++)if(vis[i].t<=now){idx=i;break}
      if(idx<0)break;
      const e=vis.splice(idx,1)[0];
      if(e.l&&LANE_PAD[e.l])flash(LANE_PAD[e.l],e.v);
      if(e.step!==undefined){if(e.beat>=0)markBeat(e.beat);markStep(e.step);T.lastStep=e.step}
      if(e.ui)ui();
      if(e.end){dropWake();markBeat(-1);markStep(-1);ui()}
    }
    if(vis.length>400)vis=vis.slice(-200);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

$('play').onclick=()=>{T.playing?stop():start()};
document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{
  const sec=b.dataset.sec;
  if(!T.playing||T.isCount){T.section=sec;ui();if(sheet==='notes')renderNotes();return}
  if(sec===T.section&&!T.queued)return;
  if(sec===T.section){T.queued=null;ui();return}
  T.queued=sec;
  if(sec!=='b')requestFill(1)||(T.crashNext=true);
  ui();
});
$('fill').onclick=()=>{
  if(!T.playing||T.isCount||T.ending)return;
  if(!requestFill(cur().beats<3?1:2))T.fillNext=cur().beats<3?1:2;
  ui();
};
$('end').onclick=()=>{
  if(!T.playing)return;
  if(T.isCount){stop();return}
  if(T.ending)return;
  T.ending=true;T.queued=null;
  if(!requestFill(cur().beats<3?1:2))T.fillNext=1;
  ui();
};
function setBpm(n){S.bpm=Math.max(40,Math.min(240,Math.round(n)));$('bpm').textContent=S.bpm;const r=$('tempoRange');if(r){r.value=S.bpm;$('tempoRangeO').textContent=S.bpm}save()}
function holdBtn(el,d){
  let t=0,c=0;const go=()=>{setBpm(S.bpm+d);c++;t=setTimeout(go,c>12?35:c>4?80:170)};
  el.addEventListener('pointerdown',e=>{e.preventDefault();c=0;setBpm(S.bpm+d);t=setTimeout(go,380)});
  ['pointerup','pointerleave','pointercancel'].forEach(n=>el.addEventListener(n,()=>clearTimeout(t)));
  el.addEventListener('click',e=>{if(e.detail===0)setBpm(S.bpm+d)});
}
holdBtn($('minus'),-1);holdBtn($('plus'),1);
let taps=[];
$('tap').addEventListener('pointerdown',e=>{
  e.preventDefault();ensureAudio();const n=performance.now();
  if(ctx&&BUF.st)play('st',1,ctx.currentTime,true);
  if(taps.length&&n-taps[taps.length-1]>2000)taps=[];
  taps.push(n);if(taps.length>6)taps.shift();
  if(taps.length>1)setBpm(60000*(taps.length-1)/(n-taps[0]));
});
function setGroove(id){
  const g=G.find(x=>x.id===id);if(!g)return;
  if(T.playing){T.queuedGroove=id;if(T.isCount){S.groove=id;T.queuedGroove=null}}
  else S.groove=id;
  S.swing=Math.round(g.sw*100);setBpm(g.bpm);
  if(!T.playing)buildBeats();
  save();ui();
}

/* ───────── Panely ───────── */
let sheet=null;
function openSheet(name){
  sheet=name;$('veil').hidden=false;
  if(name==='groove'){$('sheetTitle').textContent='Rytmy';renderGroove()}
  if(name==='notes'){noteSec=T.section;$('sheetTitle').textContent='Noty';renderNotes()}
  if(name==='mix'){$('sheetTitle').textContent='Zvuk a hra';renderMix()}
  $('closeSheet').focus();
}
function closeSheet(){sheet=null;cells=null;$('veil').hidden=true;$('sheetBody').innerHTML=''}
$('openGroove').onclick=()=>openSheet('groove');$('openNotes').onclick=()=>openSheet('notes');$('openMix').onclick=()=>openSheet('mix');
$('closeSheet').onclick=closeSheet;$('veil').addEventListener('click',e=>{if(e.target.id==='veil')closeSheet()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheet)closeSheet();
  if(e.code==='Space'&&!sheet&&e.target===document.body){e.preventDefault();$('play').click()}
});
function renderGroove(){
  const pick=T.queuedGroove||S.groove;
  $('sheetBody').innerHTML='<div class="list">'+G.map(g=>'<button class="gr'+(g.id===pick?' on':'')+'" data-g="'+g.id+'"><b>'+g.n+'</b><span>'+g.m+'</span><span>'+g.bpm+' BPM</span></button>').join('')+'</div>'+
   '<p class="hint">Počas hry bubeník prejde na nový rytmus na začiatku ďalšieho taktu.</p>';
  $('sheetBody').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{setGroove(b.dataset.g);closeSheet()});
}
let noteSec='v';
const LANES=[['c','Crash'],['R','Ride'],['o','Otv. hat'],['h','Hi-hat'],['p','Pedál'],['s','Virbel'],['r','Rim'],['T','Tom 1'],['M','Tom 2'],['F','Kotol'],['k','Kopák']];
function renderNotes(){
  const g=cur(),p=pat(g,noteSec),edited=!!(EDITS[g.id]&&EDITS[g.id][noteSec]);
  let h='<div class="seg" id="noteSeg">'+Object.keys(SEC).map(k=>'<button data-n="'+k+'" class="'+(noteSec===k?'on':'')+'">'+SEC[k]+'</button>').join('')+'</div><div class="gridwrap"><table class="grid">';
  LANES.forEach(([l,n])=>{
    const s=(p[l]||'').padEnd(g.steps,'.');
    h+='<tr><th scope="row">'+n+'</th>';
    for(let i=0;i<g.steps;i++)h+='<td class="'+(i%g.pb===0&&i?'bt':'')+'"><button class="cell" aria-label="'+n+', krok '+(i+1)+'" data-l="'+l+'" data-i="'+i+'" data-v="'+s[i]+'"></button></td>';
    h+='</tr>';
  });
  h+='</table></div><p class="hint">Klepnutím meníš úder: normálny, silný, ghost, žiadny. '+g.n+' sa zmení od ďalšieho taktu. Bubeník k tomu pridáva vlastné obmeny podľa nastavenia Živosť.</p>';
  if(edited)h+='<button class="reset" id="resetNotes">Vrátiť pôvodný rytmus</button>';
  $('sheetBody').innerHTML=h;
  $('noteSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{noteSec=b.dataset.n;renderNotes()});
  const cs=[...$('sheetBody').querySelectorAll('.cell')];
  cells=LANES.map((_,r)=>cs.slice(r*g.steps,(r+1)*g.steps));
  cs.forEach(c=>c.onclick=()=>{
    const order={'.':'x',x:'X',X:'g',g:'.',o:'x'},nv=order[c.dataset.v]||'.',l=c.dataset.l,i=+c.dataset.i;
    const cur2=pat(g,noteSec),str=(cur2[l]||'').padEnd(g.steps,'.');
    const e=(EDITS[g.id]=EDITS[g.id]||{}),es=(e[noteSec]=e[noteSec]||{});
    es[l]=str.slice(0,i)+nv+str.slice(i+1);c.dataset.v=nv;save();
    if(!$('resetNotes'))renderNotes();
  });
  const r=$('resetNotes');if(r)r.onclick=()=>{delete EDITS[g.id][noteSec];save();renderNotes()};
}
function slider(id,label,val,min,max,fmt,on){
  return {html:'<label class="sl" for="'+id+'"><span>'+label+'</span><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" value="'+val+'"><output id="'+id+'O">'+fmt(val)+'</output></label>',id,fmt,on};
}
function renderMix(){
  const pct=v=>v+'',ms=v=>(v>0?'+':'')+Math.round(v*.14)+' ms';
  const groups=[
   ['Tempo',[slider('tempoRange','BPM',S.bpm,40,240,pct,v=>setBpm(v))]],
   ['Ako hrá',[
    slider('power','Sila úderov',S.power,0,100,pct,v=>S.power=v),
    slider('life','Živosť',S.life,0,100,pct,v=>S.life=v),
    slider('human','Ľudskosť',S.human,0,100,pct,v=>S.human=v),
    slider('swing','Swing',S.swing,0,60,pct,v=>S.swing=v),
    slider('feel','Virbel',S.feel,-100,100,ms,v=>S.feel=v)]],
   ['Mix',[
    slider('vk','Kopák',S.vol.kick,0,100,pct,v=>{S.vol.kick=v;applyMix()}),
    slider('vs','Virbel',S.vol.snare,0,100,pct,v=>{S.vol.snare=v;applyMix()}),
    slider('vh','Hi-hat',S.vol.hat,0,100,pct,v=>{S.vol.hat=v;applyMix()}),
    slider('vt','Tomy',S.vol.tom,0,100,pct,v=>{S.vol.tom=v;applyMix()}),
    slider('vc','Činely',S.vol.cym,0,100,pct,v=>{S.vol.cym=v;applyMix()}),
    slider('room','Priestor',S.room,0,100,pct,v=>{S.room=v;setRoom()})]]
  ];
  const seg=(id,opts,val)=>'<div class="seg" id="'+id+'">'+opts.map(o=>'<button data-v="'+o[0]+'" class="'+(o[0]===val?'on':'')+'">'+o[1]+'</button>').join('')+'</div>';
  let h='<div><h3>Súprava</h3>'+seg('kitSeg',Object.keys(KITS).map(k=>[k,KITS[k].n]),S.kit)+'</div>'+
   '<div><h3>Počúvaš cez</h3>'+seg('outSeg',[['phone','Telefón'],['head','Slúchadlá'],['box','Reprobox']],S.out)+'</div>'+
   '<div><h3>Odpočítanie paličkami</h3>'+seg('cntSeg',[['1','Zapnuté'],['0','Vypnuté']],S.count?'1':'0')+'</div>';
  groups.forEach(([t,items])=>{h+='<div><h3>'+t+'</h3>'+items.map(i=>i.html).join('')+'</div>'});
  h+='<p class="hint">Telefón potlačí najhlbšie basy, ktoré malý reproduktor nezahrá, a kopák posunie vyššie, aby bol počuť. Virbel kladným časom hrá za dobou, záporným pred dobou. Ak na iPhone nič nepočuť, vypni tichý režim prepínačom na boku.</p>';
  $('sheetBody').innerHTML=h;
  groups.flatMap(g=>g[1]).forEach(i=>{
    const el=$(i.id);el.oninput=()=>{const v=+el.value;$(i.id+'O').textContent=i.fmt(v);i.on(v);save()};
  });
  const bind=(id,fn)=>$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{$(id).querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));fn(b.dataset.v);save()});
  bind('kitSeg',k=>{S.kit=k;$('status').textContent='Ladím súpravu…';ready=renderKit(k).then(ui)});
  bind('outSeg',o=>{S.out=o;applyOut()});
  bind('cntSeg',v=>{S.count=v==='1'});
}

/* štart */
buildBeats();ui();layout();
ready=renderKit(S.kit).then(ui);
</script>
