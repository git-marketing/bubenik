<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Paličky</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow+Condensed:wght@500;600&family=Oleo+Script:wght@700&display=swap">
<style>
/* Layout: one screen seen from the drummer's stool. Tempo above, the kit in the middle, band commands under the thumbs. */
:root{
  color-scheme:dark;
  --floor:#0e2a31; --floor-2:#14373f; --panel:#1b4650; --line:#2f606b;
  --ink:#f3ecd9; --dim:#a8c0bd;
  --bronze:#dca954; --bronze-ink:#241505;
  --shell:#b5252f; --shell-hi:#d9414a;
  --display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --text:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --script:"Oleo Script",Georgia,serif;
  background:var(--floor);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--floor);color:var(--ink);font:500 16px/1.25 var(--text);overflow:hidden;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.app{height:100%;max-width:620px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}

/* top: groove and tempo */
.top{display:grid;gap:8px;min-width:0}
.row1{display:flex;gap:10px;align-items:stretch;min-width:0}
.groove{flex:1;min-width:0;text-align:left;background:var(--floor-2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:grid;align-content:center}
.groove small{font-size:13px;color:var(--dim);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.groove strong{font:800 24px/1.05 var(--display);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tempo{display:flex;align-items:stretch;gap:4px}
.tempo button{background:var(--floor-2);border:1px solid var(--line);border-radius:10px;min-width:40px;font:800 22px var(--display)}
.tempo .tap{min-width:48px;font:600 15px var(--text);letter-spacing:.1em;color:var(--bronze)}
.tempo button:active{background:var(--panel)}
.bpm{display:grid;justify-items:center;align-content:center;min-width:64px}
.bpm b{font:800 38px/.95 var(--display);font-variant-numeric:tabular-nums}
.bpm span{font-size:11px;letter-spacing:.14em;color:var(--dim)}
.row2{display:flex;align-items:center;gap:10px;min-height:32px;min-width:0}
.beats{display:flex;gap:5px;flex:none}
.beats i{width:13px;height:13px;border-radius:50%;background:var(--panel);display:block}
.beats i.on{background:var(--bronze)}
.beats i.first.on{background:var(--shell-hi)}
#status{flex:1;min-width:0;color:var(--dim);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status em{font-style:normal;color:var(--bronze)}
.tabs{display:flex;gap:6px;flex:none}
.tabs button{padding:5px 11px;border-radius:8px;border:1px solid var(--line);font-size:15px;letter-spacing:.03em}
.tabs button:active{background:var(--panel)}

/* stage: the kit from above */
.stage{position:relative;min-height:0;touch-action:none}
.stage::before{content:"";position:absolute;inset:2% -2% 0;border-radius:46%/42%;
  background:radial-gradient(closest-side,var(--floor-2),transparent);}
.pad{position:absolute;border-radius:50%;transform:translate(-50%,-50%);touch-action:none;display:block}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:50%;pointer-events:none}
.pad .flash{position:absolute;inset:0;border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(circle,rgba(255,244,214,.75) 0 35%,rgba(255,200,110,.35) 70%,transparent 74%)}
.pad .lab{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none;color:#33261a;display:grid;line-height:1}
.pad .lab b{font:800 max(14px,calc(var(--d)*.125)) var(--display);letter-spacing:.03em;text-transform:uppercase}
.pad .lab i{font:600 12px var(--text);font-style:normal;margin-top:2px;opacity:.85}
.pad.cym .lab{top:72%;color:var(--bronze-ink)}
.pad.kick .lab{top:80%}

/* chord strip */
.row3{display:flex;gap:6px;min-width:0}
.chordbar{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;text-align:left;padding:4px 10px;border-radius:10px;background:var(--floor-2);border:1px solid var(--line);white-space:nowrap;overflow:hidden}
.chordbar small{color:var(--dim);font-size:13px;letter-spacing:.04em}
.chordbar b{font:800 26px/1.1 var(--display);color:var(--bronze)}
.chordbar span{font:600 18px var(--display);color:var(--dim);overflow:hidden;text-overflow:ellipsis}
.singbtn{flex:none;padding:4px 16px;border-radius:10px;background:var(--floor-2);border:1px solid var(--bronze);color:var(--bronze);font:800 20px var(--display)}
.singbtn.has{background:var(--bronze);color:var(--bronze-ink)}
.singbtn:active,.chordbar:active{background:var(--panel)}

/* commands */
.cmds{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr;grid-template-rows:50px 50px;gap:6px}
.cmd{border-radius:10px;background:var(--floor-2);border:1px solid var(--line);font:800 20px/1 var(--display);letter-spacing:.02em;position:relative}
.cmd:active{background:var(--panel)}
.cmd.on{background:var(--bronze);border-color:var(--bronze);color:var(--bronze-ink)}
.cmd.next{border-color:var(--bronze);color:var(--bronze);animation:pulse .5s steps(2) infinite alternate}
@keyframes pulse{to{background:var(--panel)}}
#play{grid-row:1/3;background:var(--shell);border-color:var(--shell-hi);font-size:30px;color:#fff6e6}
#play:active{background:var(--shell-hi)}
#play.live{background:var(--floor-2);border-color:var(--shell-hi);color:var(--shell-hi)}
#fill{grid-column:2/4}

/* sheets */
.veil{position:fixed;inset:0;background:rgba(5,18,22,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:620px;max-height:86%;background:var(--floor-2);border-top:2px solid var(--bronze);border-radius:16px 16px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sheet h2{margin:0;font:800 26px var(--display)}
.close{padding:7px 14px;border:1px solid var(--line);border-radius:8px}
.body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;min-height:0}
.list{display:grid;gap:4px}
.gr{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;text-align:left;padding:10px 12px;border-radius:9px;background:var(--floor);border:1px solid transparent}
.gr b{font:800 21px var(--display)}
.gr span{color:var(--dim);font-variant-numeric:tabular-nums}
.gr.on{border-color:var(--bronze)}
.gr.on b{color:var(--bronze)}
h3{margin:0 0 6px;font:600 13px var(--text);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;padding:9px 6px;border-radius:8px;background:var(--floor);border:1px solid var(--line);white-space:nowrap}
.seg button.on{background:var(--bronze);border-color:var(--bronze);color:var(--bronze-ink);font-weight:600}
.sl{display:grid;grid-template-columns:92px minmax(0,1fr) 38px;align-items:center;gap:8px;min-height:36px}
.sl output{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--bronze);margin:0;height:28px}
.hint{color:var(--dim);margin:0;font-size:15px;line-height:1.3;max-width:62ch}
.gridwrap{overflow-x:auto}
table.grid{border-collapse:separate;border-spacing:0;width:100%}
.grid th{font:600 12px var(--text);color:var(--dim);text-align:left;padding-right:6px;white-space:nowrap;position:sticky;left:0;background:var(--floor-2);z-index:1}
.grid td{padding:1px;min-width:15px}
.grid td.bt{padding-left:5px}
.cell{display:block;width:100%;height:24px;border-radius:4px;background:var(--floor);position:relative}
.cell.playh{box-shadow:inset 0 0 0 1px var(--ink)}
.cell::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:var(--bronze);width:0;height:0}
.cell[data-v=x]::after,.cell[data-v=o]::after{width:10px;height:10px}
.cell[data-v=o]::after{opacity:.7}
.cell[data-v=X]::after{width:15px;height:15px;background:var(--shell-hi)}
.cell[data-v=g]::after{width:6px;height:6px;opacity:.75}
.reset{padding:8px 12px;border:1px solid var(--line);border-radius:8px;justify-self:start}

#gtSeg button{flex:1 1 30%}
.chs{display:grid;gap:4px}
.ch{display:grid;grid-template-columns:62px minmax(0,1fr);align-items:center;gap:8px}
.ch input,.sheet select{width:100%;min-width:0;background:var(--floor);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:600 17px var(--text);user-select:text;-webkit-user-select:text}
.chprev{margin:0 0 6px 70px;color:var(--dim);font-size:14px;overflow-wrap:anywhere;min-width:0}
.chprev em,.err{color:#ff9d8f;font-style:normal}
.stepper{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepper>button:not(.reset){width:46px;height:42px;border:1px solid var(--line);border-radius:8px;font:800 22px var(--display);background:var(--floor)}
.stepper b{font:800 20px var(--display);min-width:92px;text-align:center}
.bigbtn{display:block;text-align:center;padding:12px 14px;border-radius:10px;background:var(--bronze);color:var(--bronze-ink);font:800 20px var(--display);cursor:pointer;border:1px solid var(--bronze)}
.bigbtn.alt{background:var(--floor);color:var(--ink);border-color:var(--line)}
.vocsrc,.vocsave{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}
.vocplay{display:grid;gap:6px}
#vocState{min-height:1.3em;color:var(--bronze)}
#vocPitch{display:block;width:100%;height:124px;border-radius:8px;background:var(--floor)}
.legend{display:flex;gap:14px;margin:6px 0 0;color:var(--dim);font-size:14px}
.legend span::before{content:"";display:inline-block;width:14px;height:3px;margin-right:5px;vertical-align:middle}
.legend .r::before{background:var(--shell-hi)}.legend .y::before{background:var(--bronze)}
.reset.up{margin-top:8px;display:block}

@media (orientation:landscape) and (max-height:520px){
  .app{max-width:none;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:16px}
  .stage{grid-column:1;grid-row:1/3}
  .top{grid-column:2;grid-row:1}
  .cmds{grid-column:2;grid-row:2;align-self:end;grid-template-rows:minmax(40px,1fr) minmax(40px,1fr)}
}
@media (max-width:360px){
  .tempo button{min-width:32px}.tempo .tap{min-width:40px}.bpm{min-width:52px}.bpm b{font-size:32px}
  .cmd{font-size:18px}#play{font-size:25px}
}
@media (prefers-reduced-motion:reduce){.cmd.next{animation:none;background:var(--panel)}}
</style>
</head>
<body>
<div class="app">
  <section class="top">
    <div class="row1">
      <button class="groove" id="openGroove" aria-label="Vybrať rytmus">
        <small id="gMeta">4/4</small><strong id="gName">Rock</strong>
      </button>
      <div class="tempo">
        <button id="minus" aria-label="Pomalšie">−</button>
        <div class="bpm"><b id="bpm">112</b><span>BPM</span></div>
        <button id="plus" aria-label="Rýchlejšie">+</button>
        <button class="tap" id="tap" aria-label="Vyťukať tempo">TAP</button>
      </div>
    </div>
    <div class="row2">
      <div class="beats" id="beats" aria-hidden="true"></div>
      <div id="status" aria-live="polite">Ladím súpravu…</div>
      <div class="tabs">
        <button id="openNotes">Noty</button>
        <button id="openMix">Zvuk</button>
      </div>
    </div>
    <div class="row3">
      <button class="chordbar" id="openSong" aria-label="Akordy, gitara a basa"><small>Akord</small><b id="chNow">G</b><span id="chNext"></span></button>
      <button class="singbtn" id="openVoc">Spev</button>
    </div>
  </section>

  <section class="stage" id="stage" aria-label="Bicia súprava"></section>

  <section class="cmds" aria-label="Povely pre bubeníka">
    <button class="cmd" id="play">Štart</button>
    <button class="cmd" data-sec="v">Sloha</button>
    <button class="cmd" data-sec="c">Refrén</button>
    <button class="cmd" data-sec="b">Mostík</button>
    <button class="cmd" id="fill">Prechod</button>
    <button class="cmd" id="end">Koniec</button>
  </section>
</div>

<div class="veil" id="veil" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header><h2 id="sheetTitle"></h2><button class="close" id="closeSheet">Zavrieť</button></header>
    <div class="body" id="sheetBody"></div>
  </div>
</div>

<script>
/* ───────── Rytmy ─────────
   Znaky: X silno, x normálne, o jemne, g ghost note, . nič
   Stopy: k kopák, s virbel, r rim, h hi-hat, o otvorený hat, p pedál, R ride, B zvon, c crash, T M F tomy */
const G=[
 {id:'rock',n:'Rock',m:'4/4',bpm:112,beats:4,pb:4,sw:0,fill:'toms',
  v:{k:'x.....x.x.......',s:'....X.......X...',h:'X.x.x.x.X.x.x.x.'},
  c:{k:'x.....x.x.x.....',s:'....X.......X...',o:'x.x.x.x.x.x.x.x.'},
  b:{k:'x.......x.......',r:'....x.......x...',h:'o.o.o.o.o.o.o.o.'}},
 {id:'pop',n:'Pop',m:'4/4',bpm:100,beats:4,pb:4,sw:0,fill:'toms',
  v:{k:'x.....x...x..x..',s:'....X.......X...',h:'xoxoxoxoxoxoxoxo'},
  c:{k:'x..x..x...x..x..',s:'....X.......X...',o:'x...x...x...x...',h:'..o...o...o...o.'},
  b:{k:'x.........x.....',r:'....x.......x...',p:'x.x.x.x.x.x.x.x.'}},
 {id:'funk',n:'Funk',m:'4/4',bpm:98,beats:4,pb:4,sw:.12,fill:'toms',
  v:{k:'x..x..x...x.....',s:'....X..g.g..X..g',h:'xoxoxoxoxoxoxoxo'},
  c:{k:'x.x...x..x.x..x.',s:'....X..g.g..X..g',h:'xoxoxoxoxoxoxo..',o:'..............x.'},
  b:{k:'x.........x.....',s:'....x..g.g..x...',p:'x.x.x.x.x.x.x.x.'}},
 {id:'disco',n:'Disco',m:'4/4',bpm:120,beats:4,pb:4,sw:0,fill:'toms',
  v:{k:'x...x...x...x...',s:'....X.......X...',h:'x...x...x...x...',o:'..x...x...x...x.'},
  c:{k:'X...X...X...X...',s:'....X.......X..g',h:'xo..xo..xo..xo..',o:'..x...x...x...x.'},
  b:{k:'x...x...x...x...',r:'....o.......o...',p:'..x...x...x...x.'}},
 {id:'shuffle',n:'Blues shuffle',m:'4/4 triola',bpm:92,beats:4,pb:3,sw:0,fill:'toms',
  v:{k:'x.....x.....',s:'...X.....X..',h:'x.ox.ox.ox.o'},
  c:{k:'x.ox..x.ox..',s:'...X.....X..',R:'x.ox.ox.ox.o'},
  b:{k:'x.....x.....',r:'...x.....x..',h:'o.oo.oo.oo.o'}},
 {id:'ballad',n:'Balada',m:'12/8',bpm:66,beats:4,pb:3,sw:0,fill:'toms',
  v:{k:'x.....x.o...',s:'...X.....X..',h:'xooxooxooxoo'},
  c:{k:'x..o..x.o...',s:'...X.....X..',R:'xooxooxooxoo'},
  b:{k:'x.....o.....',r:'...o.....o..',h:'o.oo.oo.oo.o'}},
 {id:'polka',n:'Polka',m:'2/4',bpm:120,beats:2,pb:4,sw:0,fill:'snare',strict:1,
  v:{k:'x...x...',s:'..x...x.',h:'..x...x.'},
  c:{k:'X...X...',s:'..X...X.',o:'..x...x.'},
  b:{k:'x...x...',r:'..o...o.',p:'..o...o.'}},
 {id:'waltz',n:'Valčík',m:'3/4',bpm:150,beats:3,pb:4,sw:0,fill:'snare',strict:1,
  v:{k:'x...........',s:'....x...x...',h:'....x...x...'},
  c:{k:'X.......o...',s:'....X...x...',o:'....x...x...'},
  b:{k:'x...........',r:'....o...o...',p:'....o...o...'}},
 {id:'bossa',n:'Bossa nova',m:'4/4',bpm:130,beats:4,pb:4,sw:0,fill:'snare',strict:1,
  v:{k:'x..oo..ox..oo..o',r:'x..x..x...x.x...',h:'o.o.o.o.o.o.o.o.'},
  c:{k:'x..xx..xx..xx..x',r:'x..x..x...x.x...',R:'x.o.x.o.x.o.x.o.'},
  b:{k:'o..oo..oo..oo..o',r:'o..o..o...o.o...',p:'..o...o...o...o.'}},
 {id:'reggae',n:'Reggae',m:'4/4',bpm:76,beats:4,pb:4,sw:.2,fill:'snare',strict:1,
  v:{k:'........X.......',r:'........x.......',h:'x.x.x.x.x.x.x.x.'},
  c:{k:'x.......X.......',s:'........X.......',h:'x.xox.x.x.xox.x.'},
  b:{k:'........x.......',r:'........o.......',p:'x...x...x...x...'}},
 {id:'hiphop',n:'Hip-hop',m:'4/4',bpm:88,beats:4,pb:4,sw:.32,fill:'snare',
  v:{k:'x.....x..x.x....',s:'....X.......X...',h:'x.x.x.x.x.x.x.x.'},
  c:{k:'x..x..x..x.x..x.',s:'....X.......X...',h:'xoxoxoxoxoxoxoxo'},
  b:{k:'x.........x.....',r:'....x.......x...',h:'x...x...x...x...'}},
 {id:'metal',n:'Metal',m:'4/4',bpm:150,beats:4,pb:4,sw:0,fill:'toms',
  v:{k:'x.xxx.xxx.xxx.xx',s:'....X.......X...',R:'X.x.X.x.X.x.X.x.'},
  c:{k:'xxxxxxxxxxxxxxxx',s:'....X.......X...',c:'x...x...x...x...'},
  b:{k:'x..x..x.x..x..x.',s:'........X.......',o:'x...x...x...x...'}},
 {id:'country',n:'Country',m:'4/4',bpm:110,beats:4,pb:4,sw:0,fill:'snare',
  v:{k:'x...x...x...x...',s:'gogoXogogogoXogo',p:'..x...x...x...x.'},
  c:{k:'x...x...x...x...',s:'gogoXogogogoXogo',o:'..x...x...x...x.'},
  b:{k:'x.......x.......',r:'....x.......x...',p:'..x...x...x...x.'}},
 {id:'swing',n:'Jazz swing',m:'4/4 triola',bpm:140,beats:4,pb:3,sw:0,fill:'snare',strict:1,
  v:{k:'g..g..g..g..',s:'.....g......',R:'x..x.ox..x.o',p:'...x.....x..'},
  c:{k:'x.....g..o..',s:'.....o.....x',R:'X..x.oX..x.o',p:'...x.....x..'},
  b:{s:'o.oo.oo.oo.o',p:'...x.....x..'}}
];
G.forEach(g=>g.steps=g.beats*g.pb);
const V={X:1,x:.78,o:.5,g:.24};
const SEC={v:'Sloha',c:'Refrén',b:'Mostík'};

/* ───────── Kapela: akordy, gitara, basa ───────── */
const B3=(a,b,c)=>({v:a,c:b,b:c});
const BAND={
 rock:{gt:'cr',ch:B3('G D Em C','C G D Em','Em C G D'),g:B3('P.P.P.P.P.P.P.P.','H.....H.H.....H.','1...2...3...2...'),n:B3('R.R.R.R.R.R.R.R.','R.R.R.R.F.F.R.A.','R.......R.......')},

function ks(midi,dur,bright,decayT,pick,damp){
  const f=440*Math.pow(2,(midi-69)/12),n=Math.floor(dur*SR),buf=new AudioBuffer({length:n,numberOfChannels:1,sampleRate:SR}),y=buf.getChannelData(0);
  const P=SR/f,L=Math.max(2,Math.floor(P-damp-.15)),d=P-L-damp,a=(1-d)/(1+d),line=new Float32Array(L);
  let lp=0;for(let i=0;i<L;i++){lp+=((Math.random()*2-1)-lp)*bright;line[i]=lp}
  const tmp=line.slice(),pn=Math.max(1,Math.round(L*pick));
  let mean=0;for(let i=0;i<L;i++){line[i]=tmp[i]-.9*tmp[(i-pn+L)%L];mean+=line[i]}
  mean/=L;let pk=1e-4;for(let i=0;i<L;i++){line[i]-=mean;pk=Math.max(pk,Math.abs(line[i]))}
  for(let i=0;i<L;i++)line[i]/=pk;
  const loss=Math.pow(.001,1/(decayT*f));
  let p=0,prev=0,x1=0,y1=0;
  for(let i=0;i<n;i++){

    const fl=loss*((1-damp)*c+damp*prev);prev=c;
    const o=a*fl+x1-a*y1;x1=fl;y1=o;
    line[p]=o;p=(p+1)%L;
  }
  const fade=Math.floor(n*.08);for(let i=0;i<fade;i++)y[n-1-i]*=i/fade;
  return buf;
}

  const D=4,y=new Float32Array(Math.floor(x.length/D));
  for(let i=0;i<y.length;i++)y[i]=(x[i*D]+x[i*D+1]+x[i*D+2]+x[i*D+3])/4;
  const W=340,TM=170,HOP=128,nf=Math.max(0,Math.floor((y.length-W-TM)/HOP));
  const f0=new Float32Array(nf),d=new Float32Array(TM+1),rate=SR/D;
  for(let fr=0;fr<nf;fr++){
    if(fr%300===0){vocMsg('Počúvam spev… '+Math.round(fr/nf*100)+' %');await tick0()}
    const s=fr*HOP;let e=0;for(let j=0;j<W;j+=4)e+=y[s+j]*y[s+j];
    if(Math.sqrt(e/(W/4))<.012)continue;
    let run=0;d[0]=1;
    for(let tau=1;tau<=TM;tau++){let sum=0;for(let j=0;j<W;j++){const q=y[s+j]-y[s+j+tau];sum+=q*q}run+=sum;d[tau]=run>0?sum*tau/run:1}
    let tau=-1;for(let k=14;k<TM;k++){if(d[k]<.2){while(k+1<TM&&d[k+1]<d[k])k++;tau=k;break}}
    if(tau<0)continue;
    const a=d[tau-1],b=d[tau],c=d[tau+1],den=a-2*b+c;f0[fr]=rate/(tau+(den?(a-c)/(2*den):0));
  }
  const med=new Float32Array(nf);
  for(let i=0;i<nf;i++){if(!f0[i])continue;const w=[];for(let j=Math.max(0,i-2);j<=Math.min(nf-1,i+2);j++)if(f0[j])w.push(f0[j]);w.sort((p,q)=>p-q);med[i]=w[w.length>>1]}
  for(let i=0;i<nf;){if(med[i]){let j=i;while(j<nf&&med[j])j++;if(j-i<4)med.fill(0,i,j);i=j}else i++}
  const H=HOP*D,marks=[];let pos=0;
  while(pos<x.length){
    const fr=Math.floor(pos/H),f=fr<nf?med[fr]:0;
    if(!f){pos+=256;continue}
    const T0=SR/f,a=Math.floor(pos+T0*.8),b=Math.min(x.length-1,Math.ceil(pos+T0*1.2));let p=a,mx=-9;
    for(let i=a;i<=b;i++)if(x[i]>mx){mx=x[i];p=i}
    marks.push(p);pos=Math.max(pos+T0*.5,p);
  }
  const mid=new Float32Array(nf),cen=new Float32Array(nf);
  for(let i=0;i<nf;i++)if(med[i])mid[i]=69+12*Math.log2(med[i]/440);
  for(let i=0;i<nf;i++){if(!mid[i])continue;let s=0,c=0;for(let j=Math.max(0,i-4);j<=Math.min(nf-1,i+4);j++)if(mid[j]){s+=mid[j];c++}cen[i]=s/c}

}

  const h=new Array(12).fill(0);for(let i=0;i<an.nf;i++)if(an.cen[i])h[pc(Math.round(an.cen[i]))]++;
  let best=0,bs=-1;for(let r=0;r<12;r++){let s=0;for(let i=0;i<12;i++)s+=h[pc(r+i)]*prof[i];if(s>bs){bs=s;best=r}}

}

 stu:{n:'Štúdio',tune:60,dbl:25,room:40,echo:12,harm:'none'},
 rad:{n:'Rádio',tune:100,dbl:45,room:35,echo:22,harm:'none'},
 duo:{n:'Dvojhlas',tune:65,dbl:15,room:45,echo:10,harm:'up'}
};
function renderVocalIf(){if(sheet==='voc')renderVocal()}
function renderVocal(){
  const b=$('sheetBody'),v=S.voc,has=!!VOC.buf.lead,keys=[['auto','Podľa akordov: '+keyName(songKey())]];
  for(let r=0;r<12;r++)keys.push([r+':maj',NAMES[r]+' dur'],[r+':min',NAMES[r]+' mol']);
  const seg=(id,opts,val)=>'<div class="seg" id="'+id+'">'+opts.map(o=>'<button data-v="'+o[0]+'" class="'+(o[0]===val?'on':'')+'">'+o[1]+'</button>').join('')+'</div>';
  let h='<div class="vocsrc"><label class="bigbtn" for="vocFile">Vložiť nahrávku spevu</label><input id="vocFile" type="file" accept="audio/*,video/mp4,video/quicktime,.m4a,.mp3,.wav,.aac,.ogg" hidden>'+
    (micAllowed()?'<button class="bigbtn alt" id="vocRec">'+(REC?'Ukončiť nahrávanie':'Nahrať mikrofónom')+'</button>':'')+
    '<button class="bigbtn alt" id="vocDemo">Skúsiť ukážku</button></div>';
  if(VOC.err)h+='<p class="hint err">'+VOC.err+'</p>';
  if(!has&&!VOC.busy)h+='<p class="hint">'+(micAllowed()?'Pri nahrávaní mikrofónom nos slúchadlá, aby sa kapela nenahrala do spevu.':'Nahraj spev v Diktafóne alebo Hlasovom zázname a kapelu si púšťaj z druhého telefónu do slúchadiel. Spievaj v rovnakom tempe a začni na prvú dobu takmer bez ticha pred sebou.')+' Nahrávka zostáva len v tvojom telefóne a po zatvorení stránky sa stratí.</p>';
  h+='<p class="hint" id="vocState">'+(VOC.msg||'')+'</p>';
  if(has||VOC.busy){
    h+='<div><h3>'+(VOC.name||'Spev').replace(/</g,'&lt;')+(VOC.x?' · '+fmtTime(VOC.x.length/SR):'')+'</h3>'+(VOC.cut?'<p class="hint">Spracoval som prvých 6 minút.</p>':'')+'<canvas id="vocPitch" aria-label="Priebeh výšky tónu pred úpravou a po nej"></canvas><p class="legend"><span class="r">Tvoj hlas</span><span class="y">Po doladení</span></p></div>';
  }
  if(has){
    h+='<div class="vocplay"><button class="bigbtn" id="vocPlay">'+(T.playing?'Stop':'Prehrať s kapelou')+'</button>'+seg('abSeg',[['1','Vylepšený'],['0','Pôvodný']],VOC.fx?'1':'0')+'</div>';
    h+='<div><h3>Zvuk spevu</h3>'+seg('preSeg',Object.keys(PRESETS).map(k=>[k,PRESETS[k].n]),matchPreset())+'</div>';
    h+='<div><h3>Druhý hlas</h3>'+seg('hmSeg',[['none','Bez'],['up','Tercia hore'],['down','Tercia dole'],['both','Oba']],v.harm)+'</div>';
    h+=sliderGroup('Doladenie',[slider('vTune','Ladenie',v.tune,0,100,x=>x+'',x=>{v.tune=x;queueProcess();clearPreset()}),slider('vDbl','Zdvojenie',v.dbl,0,100,x=>x+'',x=>{const was=v.dbl>0;v.dbl=x;if(was!==(x>0))queueProcess();clearPreset()}),slider('vHl','Druhý hlas',v.hlvl,0,100,x=>x+'',x=>{v.hlvl=x}),slider('vRoom','Priestor',v.room,0,100,x=>x+'',x=>{v.room=x;applyVoc();clearPreset()}),slider('vEcho','Ozvena',v.echo,0,100,x=>x+'',x=>{v.echo=x;applyVoc();clearPreset()}),slider('vVol','Hlasitosť',v.vol,0,100,x=>x+'',x=>{v.vol=x;applyVoc()})]);
    h+='<div><h3>Tónina spevu</h3><select id="vKey" aria-label="Tónina spevu">'+keys.map(k=>'<option value="'+k[0]+'"'+(k[0]===(v.key||'auto')?' selected':'')+'>'+k[1]+'</option>').join('')+'</select><button class="reset up" id="vFit">Preladiť kapelu na môj spev</button></div>';
    h+=sliderGroup('Nástup spevu',[slider('vEntry','V takte',v.entry,1,32,x=>x+'',x=>{v.entry=x}),slider('vShift','Posun',v.shift,-1000,1000,x=>(x>0?'+':'')+x,x=>{v.shift=x})]);
    h+='<p class="hint">Posun je v milisekundách. Ak spev uteká pred kapelu, daj kladné číslo. Tempo nahrávky sa nemení, preto musí sedieť s BPM kapely.</p>';
    h+='<div class="vocsave"><button class="bigbtn alt" id="saveMix">Uložiť celú pieseň</button><button class="bigbtn alt" id="saveVoc">Uložiť len spev</button></div><p class="hint">Uloží sa ZIP so zvukom WAV. Pieseň použije aj tvoje povely z posledného prehratia, teda slohu, refrén a prechody.</p>';
  }
  b.innerHTML=h;
  bindSliders();
  $('vocFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(T.playing)stop();S.voc.entry=1;S.voc.shift=0;await loadVocal(await f.arrayBuffer(),f.name)};
  $('vocDemo').onclick=async()=>{if(T.playing)stop();S.voc.entry=1;S.voc.shift=0;await demoVocal()};
  if($('vocRec'))$('vocRec').onclick=toggleRec;
  if(has){
    $('vocPlay').onclick=()=>{T.playing?stop():start();setTimeout(renderVocalIf,120)};
    const bind=(id,fn)=>$(id).querySelectorAll('button').forEach(x=>x.onclick=()=>{$(id).querySelectorAll('button').forEach(y=>y.classList.toggle('on',y===x));fn(x.dataset.v);save()});
    bind('abSeg',x=>{VOC.fx=x==='1';applyVoc()});
    bind('preSeg',k=>{Object.assign(S.voc,PRESETS[k]);delete S.voc.n;applyVoc();processVoc().then(renderVocalIf);renderVocal()});
    bind('hmSeg',x=>{S.voc.harm=x;clearPreset();queueProcess()});
    $('vKey').onchange=e=>{S.voc.key=e.target.value;save();queueProcess()};
    $('vFit').onclick=()=>{
      const sk=songKey(),r=detectKey(VOC.an,sk.mode);if(r===null){vocMsg('V nahrávke som nenašiel dosť speváckych tónov.');return}
      let d=pc(r-sk.root);if(d>6)d-=12;S.transp=Math.max(-11,Math.min(11,S.transp+d));S.voc.key='auto';save();ui();
      vocMsg('Spievaš v tónine '+NAMES[r]+(sk.mode==='min'?' mol':' dur')+'. Kapela je preladená.');const m=VOC.msg;processVoc().then(()=>{renderVocalIf();vocMsg(m)});
    };
    $('saveVoc').onclick=async()=>{
      vocMsg('Skladám spev…');const B=VOC.buf,o=new OfflineAudioContext(2,B.lead.length,SR),s0=ctx,sA=A,sS=VOC.srcs;
      ctx=o;A=buildGraph(o);VOC.srcs=[];BOUNCE=true;applyVoc();
      const e=S.voc.entry,sh=S.voc.shift,ld=VOC.lead;S.voc.entry=1;S.voc.shift=0;VOC.lead=0;startVocal(0);S.voc.entry=e;S.voc.shift=sh;VOC.lead=ld;
      const r=await o.startRendering();ctx=s0;A=sA;VOC.srcs=sS;BOUNCE=false;
      await saveWav('Palicky-spev',[r.getChannelData(0),r.getChannelData(1)]);
    };
    $('saveMix').onclick=async()=>{
      vocMsg('Mixujem pieseň…');await tick0();const r=await bounce();if(!r){vocMsg('Najprv zastav prehrávanie.');return}
      await saveWav('Palicky-piesen',[r.getChannelData(0),r.getChannelData(1)]);
    };
  }
  drawPitch();
}
function matchPreset(){const v=S.voc;for(const k in PRESETS){const p=PRESETS[k];if(p.tune===v.tune&&p.dbl===v.dbl&&p.room===v.room&&p.echo===v.echo&&p.harm===v.harm)return k}return ''}
function clearPreset(){const s=$('preSeg');if(s)s.querySelectorAll('button').forEach(y=>y.classList.remove('on'))}
function fmtTime(s){const m=Math.floor(s/60),q=Math.round(s-m*60);return m+':'+String(q).padStart(2,'0')}

/* štart */
buildBeats();ui();layout();
ready=renderKit(S.kit).then(ui);
</script>
</body>
</html>
